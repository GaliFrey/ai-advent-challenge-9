[project]
name = "ai-advent-day-21"
version = "0.1.0"
description = "Local document indexing and chunking comparison"
requires-python = ">=3.12"
dependencies = [
    "rich>=15,<16",
    "sentence-transformers>=5.1,<6",
    "torch>=2.10,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
