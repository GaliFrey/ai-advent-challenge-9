[project]
name = "ai-advent-day-22"
version = "0.1.0"
description = "First RAG query and a controlled comparison of ten questions"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1,<2",
    "rich>=15,<16",
    "sentence-transformers>=5.1,<6",
    "textual>=8,<9",
    "torch>=2.10,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
