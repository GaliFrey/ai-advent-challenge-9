[project]
name = "personal-assistent"
version = "0.1.0"
description = "Личный Telegram-ассистент: памятки, напоминания и DeepSeek"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "snowballstemmer>=3.1.0,<4",
]

[project.optional-dependencies]
voice = [
    "onnx-asr[cpu,hub]==0.12.0",
    "onnxruntime==1.31.0",
    "aiohttp>=3.14.5,<4",
]

[tool.uv]
package = false
