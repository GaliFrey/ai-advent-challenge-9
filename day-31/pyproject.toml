[project]
name = "ai-advent-day-31"
version = "0.1.0"
description = "Developer assistant: project documentation RAG and read-only Git MCP"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "mcp>=1,<2",
    "python-dotenv>=1,<2",
    "rich>=15,<16",
    "sentence-transformers>=5.1,<6",
    "torch>=2.10,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
