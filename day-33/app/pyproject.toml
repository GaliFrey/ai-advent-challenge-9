[project]
name = "guitar-trainer"
version = "0.1.0"
description = "Тюнер Guitar Trainer со встроенным локальным сервером поддержки"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "mcp>=2,<3",
    "uvicorn>=0.27",
    "sentence-transformers==6.1.0",
    "transformers==5.19.0",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Проект — приложение, а не устанавливаемый пакет: отдельная сборка не нужна,
# серверный код запускается напрямую из каталога server/.
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "--basetemp=data/tmp/pytest -p no:cacheprovider"
