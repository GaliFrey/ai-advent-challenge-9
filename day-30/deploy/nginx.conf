limit_req_zone $binary_remote_addr zone=day30:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name __IP__;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://__IP__$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name __IP__;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/day30/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/day30/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:day30_tls:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 64k;
    limit_req_status 429;
    location / {
        limit_req zone=day30 burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
